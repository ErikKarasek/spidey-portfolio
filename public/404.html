<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | Erik Karásek</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕷️</text></svg>" />
    <script>
      // Same suit as the rest of the site.
      try {
        if (localStorage.getItem('symbiote') === '1') document.documentElement.classList.add('symbiote')
      } catch (e) {}
    </script>
    <style>
      /* Same self-hosted font as the site (public/fonts, copied from @fontsource-variable/outfit). */
      @font-face { font-family: 'Outfit Variable'; font-style: normal; font-display: swap; font-weight: 100 900; src: url(/fonts/outfit-latin-ext-wght-normal.woff2) format('woff2-variations'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      @font-face { font-family: 'Outfit Variable'; font-style: normal; font-display: swap; font-weight: 100 900; src: url(/fonts/outfit-latin-wght-normal.woff2) format('woff2-variations'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      :root { --bg: #fff; --ink: #111827; --mute: #6b7280; --accent: #a31515; --accent-ink: #fff; --shadow: #ef4444; --web: multiply; --web-filter: none }
      html.symbiote { --bg: #0a0a0b; --ink: #f4f4f5; --mute: #a1a1aa; --accent: #f4f4f5; --accent-ink: #0a0a0b; --shadow: #71717a; --web: screen; --web-filter: invert(1) }
      * { box-sizing: border-box; margin: 0 }
      body { min-height: 100vh; display: grid; place-items: center; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Outfit Variable', system-ui, sans-serif; text-align: center; padding: 24px }
      .web { position: fixed; width: 520px; height: 520px; opacity: .35; mix-blend-mode: var(--web); filter: var(--web-filter); pointer-events: none; animation: spin 90s linear infinite }
      .web.a { top: -160px; left: -160px } .web.b { bottom: -200px; right: -180px; width: 620px; height: 620px; animation-direction: reverse }
      .hang { position: fixed; top: 0; right: 12vw; display: flex; flex-direction: column; align-items: center; transform-origin: top center; animation: swing 3s ease-in-out infinite alternate }
      .hang i { width: 2px; height: 22vh; background: linear-gradient(transparent, #9ca3af) }
      .hang img { width: 130px; margin-top: -8px; filter: drop-shadow(0 12px 18px rgba(0,0,0,.25)) }
      main { position: relative; z-index: 1; max-width: 560px }
      .code { font-size: clamp(96px, 22vw, 200px); line-height: .9; font-weight: 900; font-style: italic; letter-spacing: -.04em; text-shadow: 6px 6px 0 var(--shadow), 11px 11px 0 var(--accent) }
      .label { margin-top: 18px; color: var(--accent); font-weight: 800; font-size: 13px; letter-spacing: .25em; text-transform: uppercase }
      h1 { margin-top: 10px; font-size: clamp(22px, 4vw, 32px); font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -.02em }
      p { margin-top: 10px; color: var(--mute); font-weight: 500; line-height: 1.5 }
      p + p { font-size: 14px }
      a { display: inline-block; margin-top: 28px; padding: 13px 30px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; transition: transform .25s }
      a:hover { transform: translateY(-3px) }
      @keyframes spin { to { rotate: 360deg } }
      @keyframes swing { from { rotate: -5deg } to { rotate: 5deg } }
      @media (max-width: 700px) { .hang { right: 4vw } .hang img { width: 90px } }
    </style>
  </head>
  <body>
    <img class="web a" src="/img/web.webp" alt="" />
    <img class="web b" src="/img/web.webp" alt="" />
    <div class="hang"><i></i><img id="spidey" src="/img/spidey-hang.webp" alt="" /></div>
    <main>
      <div class="code">404.</div>
      <div class="label">Stránka nenalezena · Page not found</div>
      <h1>Tahle stránka se zamotala do pavučiny.</h1>
      <p>Odkaz je asi špatně, nebo tahle stránka nikdy neexistovala.</p>
      <p>This page got tangled in a web. The link is probably wrong.</p>
      <a href="/">Zpět domů · Back home</a>
    </main>
    <script>
      if (document.documentElement.classList.contains('symbiote')) document.getElementById('spidey').src = '/img/symbiote/spidey-hang.webp'
    </script>
  </body>
</html>
