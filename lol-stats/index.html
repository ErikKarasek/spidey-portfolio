    <script>
      // Put the suit on before first paint so Symbiote mode doesn't flash white. With no saved choice,
      // follow the system's dark mode.
      try {
        var saved = localStorage.getItem('symbiote')
        var on = saved === null ? matchMedia('(prefers-color-scheme: dark)').matches : saved === '1'
        if (on) document.documentElement.classList.add('symbiote')
      } catch (e) {}
